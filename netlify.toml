[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/custom-elements/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/custom-elements/favicon.svg"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "/custom-elements/*"
  to = "/index.html"
  status = 200
