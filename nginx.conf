user nginx;
pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Serve the app under /custom-elements/*
        location /custom-elements/ {
            # With root above, maps to /usr/share/nginx/html/custom-elements/
            try_files $uri $uri/ /custom-elements/index.html;
        }

        # Static assets under /custom-elements/*: cache and avoid logs noise
        location ~* ^/custom-elements/.+\.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
            expires 7d;
            access_log off;
            try_files $uri =404;
        }

        # Deny root path to avoid accidental exposure
        location = / {
            return 404;
        }
    }
}